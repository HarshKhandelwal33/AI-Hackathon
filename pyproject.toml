[project]
name = "loglens-mcp"
version = "0.1.0"
description = "Role-aware, evidence-first log analysis tools for SereneDB"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12,<2",
  "openai>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
loglens-mcp = "loglens.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loglens"]

